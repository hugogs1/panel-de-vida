<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de Vida</title>
  <meta name="description" content="Panel de vida personal: cartera y finanzas, hábitos y salud, y agenda.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e0f11">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/desktop.css">

  <script>
    // 1. Registro inmediato de Service Worker y comprobación de actualización al inicio
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!hadController || reloading) return;
        reloading = true;
        try { sessionStorage.setItem('pv-updated', '1'); } catch (e) {}
        location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(function(reg) {
        window.__pvSwReg = reg;
        reg.update().catch(function() {});
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') reg.update().catch(function() {});
        });
      }).catch(function(err) { console.error('SW reg error:', err); });
    }

    // 2. Pantalla de auto-recuperación si falla la carga o se congela la caché vieja
    function showRecovery(msg) {
      var view = document.getElementById('view');
      if (!view) return;
      view.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">' +
        '<div style="font-size:38px;margin-bottom:12px">⚡</div>' +
        '<h2 style="font-size:18px;margin:0 0 8px;font-weight:700">Actualizando Panel de Vida</h2>' +
        '<p style="color:#8E8E93;font-size:13px;line-height:1.5;margin:0 0 20px">' +
        (msg ? '<span style="color:#FF453A;display:block;margin-bottom:10px;font-size:12px">' + msg + '</span>' : '') +
        'Se ha publicado una versión nueva. Pulsa para limpiar la memoria caché y abrir la app al instante.' +
        '</p>' +
        '<button id="btn-force-reload" type="button" style="background:#00F0FF;color:#000;font-weight:700;font-size:14px;border:none;border-radius:12px;padding:14px 22px;cursor:pointer;width:100%;max-width:300px;box-shadow:0 4px 18px rgba(0,240,255,0.35);">' +
        '🔄 Limpiar caché y cargar versión nueva' +
        '</button>' +
        '</div>';
      var btn = document.getElementById('btn-force-reload');
      if (btn) {
        btn.onclick = function() {
          btn.textContent = 'Actualizando...';
          btn.disabled = true;
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations().then(function(regs) {
                  return Promise.all(regs.map(function(r) { return r.unregister(); }));
                });
              }
            }).finally(function() {
              location.replace(location.pathname + '?nocache=' + Date.now() + location.hash);
            });
          } else {
            location.reload();
          }
        };
      }
    }

    // 3. Captura global de errores de ejecución
    window.addEventListener('error', function(e) {
      console.error('Global error:', e);
      var view = document.getElementById('view');
      if (view && (!view.children || view.children.length === 0)) {
        showRecovery('Aviso de carga: ' + (e.message || 'Error en script'));
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled rejection:', e);
      var view = document.getElementById('view');
      if (view && (!view.children || view.children.length === 0)) {
        showRecovery('Aviso de carga: ' + (e.reason && e.reason.message ? e.reason.message : 'Error inesperado'));
      }
    });

    // 4. Watchdog: si tras 2 segundos el contenedor principal sigue en blanco, intenta auto-recuperar
    setTimeout(function() {
      var view = document.getElementById('view');
      if (view && (!view.children || view.children.length === 0) && !view.innerHTML.trim()) {
        var autoKey = 'pv_autorefresh_' + (new Date().toISOString().slice(0, 10));
        var count = parseInt(sessionStorage.getItem(autoKey) || '0', 10);
        if (count < 1 && 'caches' in window) {
          sessionStorage.setItem(autoKey, String(count + 1));
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).then(function() {
            location.reload();
          });
        } else {
          showRecovery('La pantalla tardó demasiado en responder.');
        }
      }
    }, 2000);
  </script>
</head>
<body>
  <div class="app">
    <!-- Menú lateral: solo visible en pantallas anchas (ordenador) -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a class="tab" data-area="resumen" href="#resumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 20v-9.5z"/><path d="M9 21v-7h6v7"/></svg>
        <span>Hoy</span>
      </a>
      <a class="tab" data-area="fin" href="#finanzas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/><path d="M7 3.5h10"/></svg>
        <span>Finanzas</span>
      </a>
      <button class="plus" id="plus" type="button" aria-label="Apuntar algo rápido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a class="tab" data-area="hab" href="#habitos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
        <span>Hábitos</span>
      </a>
      <a class="tab" data-area="ag" href="#agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8.5 3v4M15.5 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>
        <span>Agenda</span>
      </a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <noscript>Esta app necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js?v=0.40.0"></script>
</body>
</html>
